# Family Board Books photo and cartoon API (Cloudflare Worker).
# Deploy: npx wrangler deploy   (from this folder, after `npx wrangler login`)
name = "familyboardbooks-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Public address: https://familyboardbooks-api.silent-forest-c98a.workers.dev
workers_dev = true
preview_urls = false

# Private photo storage, kept in Cloudflare's EU jurisdiction.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fbb-photos"
jurisdiction = "eu"

# Daily clean-up (03:17 UTC): unpaid previews, printed originals, delivered books.
[triggers]
crons = ["17 3 * * *"]

# At most 5 new books per minute from one connection.
[[ratelimits]]
name = "DRAFT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
ENGINE = "auto"            # auto (per style, below), gemini or openai (force one), mock (no AI, for testing)
# Which model draws each style. If one fails, the other is used as a backup.
STYLE_ENGINES = '{"splash":"gemini","painted":"openai","watercolour":"gemini","comic":"gemini","storybook":"openai"}'
GEMINI_MODEL = "gemini-3.1-flash-image"
OPENAI_MODEL = "gpt-image-2"
OPENAI_QUALITY = "medium"
ALLOWED_ORIGINS = "https://www.familyboardbooks.com,https://familyboardbooks.com"
FREE_SLOTS = "6"           # free cartoons before paying (two pages)
FREE_GENS = "10"           # free tries in total, so a few redos
UNPAID_DAYS = "14"         # unpaid previews are deleted after this many days
FREE_DAILY_CAP = "150"     # free preview cartoons per day for the whole site (cost ceiling)
FREE_IP_DAILY = "12"       # free preview cartoons per day from one internet connection

# Secrets (set with `npx wrangler secret put NAME`, never written in this file):
#   GEMINI_API_KEY, OPENAI_API_KEY, SHOPIFY_WEBHOOK_SECRET, ADMIN_TOKEN, TURNSTILE_SECRET (optional)
