# Family Board Books photo and cartoon API (Cloudflare Worker).
# Deploy: npx wrangler deploy   (from this folder, after `npx wrangler login`)
name = "familyboardbooks-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Public address: https://familyboardbooks-api.silent-forest-c98a.workers.dev
workers_dev = true
preview_urls = false

# Private photo storage, kept in Cloudflare's EU jurisdiction.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fbb-photos"
jurisdiction = "eu"

# Daily clean-up (03:17 UTC): unpaid previews, printed originals, delivered books.
# Every 10 minutes: the print queue (make PDFs, send to Lulu, follow Lulu's status) and painting of paid storybooks
# (painting.js: every page at print size, "pages ready" email, reminders, printing on day 4 if not approved).
[triggers]
crons = ["17 3 * * *", "*/10 * * * *"]

# Keep the worker's logs (errors such as an AI account running out of credit) so they can be looked at later.
[observability]
enabled = true

# Cloudflare's built-in browser (Browser Run), which saves a book's print page as PDF.
# The free plan allows 10 browser minutes a day; one book takes well under a minute.
[browser]
binding = "BROWSER"

# Cloudflare Images: smaller screen copies of print-size pictures (free plan: 5,000 a month).
[images]
binding = "IMAGES"

# At most 5 new books per minute from one connection.
[[ratelimits]]
name = "DRAFT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
ENGINE = "auto"            # auto (per style, below), gemini or openai (force one), mock (no AI, for testing)
# Which model draws each style. If one fails, the other is used as a backup.
STYLE_ENGINES = '{"splash":"gemini","painted":"openai","watercolour":"gemini","comic":"gemini","storybook":"openai"}'
GEMINI_MODEL = "gemini-3.1-flash-image"
OPENAI_MODEL = "gpt-image-2"
OPENAI_QUALITY = "medium"
ALLOWED_ORIGINS = "https://www.familyboardbooks.com,https://familyboardbooks.com,https://www.familystorybooks.co.uk,https://familystorybooks.co.uk,https://www.familylearntoread.com,https://familylearntoread.com"  # Family Storybooks uses the story characters (c-{role})
FREE_SLOTS = "6"           # free cartoons before paying (two pages)
FREE_GENS = "10"           # free tries in total, so a few redos
UNPAID_DAYS = "14"         # unpaid previews are deleted after this many days
STORY_ENGINE = "gemini"     # model for story-book characters and scenes (the other is the backup)
PRINT_IMAGE_SIZE = "4K"    # paid storybooks draw their scenes at this Gemini size for printing (free preview stays 1K)
FREE_DAILY_CAP = "150"     # free preview cartoons per day for the whole site (cost ceiling)
FREE_IP_DAILY = "12"       # free preview cartoons per day from one internet connection
ART_DRAFTS = "etsdm70z4pt280jwhd7s,ozad0a0u33idz9zkkcs8"  # our own example artwork (Storybooks example pages; Learn to Read sets): no free limits, still needs its secret token
TEST_DRAFTS = "qaiwrpj78yo4nh4hscuj"  # paid books we may copy for a private test (POST /api/drafts/<id>/testcopy, with that book's own token); copies are never emailed or printed
# PAINT_METHOD = "swap"   # paint new paid storybooks one family member at a time, with an automatic check (swap.js). Off until the test copies look right.

# Printer: Lulu Print API, shared by every brand. "sandbox" = Lulu's test system (nothing printed or charged); "live" = real orders.
LULU_ENV = "live"
# Book products printed by Lulu, keyed by our own product code. brand = SKU prefix in Shopify;
# pkg = Lulu pod_package_id (trim, colour, quality, binding, paper, finish); pages = interior pages;
# bookPrefix = drafts whose book starts with this are printed by Lulu; printUrl = the brand's print page ({story}).
# A new brand (e.g. learn-to-read books, FLR) adds its own rows here.
PRINT_PRODUCTS = '{"storybook":{"brand":"FST","name":"Family Storybooks hardcover, 8.5 in square","pkg":"0850X0850FCPRECW080CW444GXX","pages":28,"bookPrefix":"fst-","printUrl":"https://www.familystorybooks.co.uk/print.html?story={story}"},"reader":{"brand":"FLR","name":"Family Learn to Read paperback, 8.5 in square","pkg":"0850X0850FCSTDPB060UW444GXX","pages":32,"bookPrefix":"flr-","printUrl":"https://www.familylearntoread.com/print.html?story={story}"}}'

# The shared Shopify store. Printing marks an order "being made" there when it goes to the printer (no more
# self-service cancel), then adds the tracking. Needs SHOPIFY_ADMIN_TOKEN, or SHOPIFY_CLIENT_ID + SHOPIFY_CLIENT_SECRET.
SHOPIFY_SHOP = "nuwppy-0s.myshopify.com"

# Each brand by SKU prefix: the name and hello@ address customers see in our own emails (file reminders),
# and where problem reports go. An address must be on a domain verified in ZeptoMail before it can send.
# Brands without their own email domain yet use hello@familyboardbooks.com.
BRANDS = '{"FBB":{"name":"Family Board Books","site":"https://www.familyboardbooks.com","email":"hello@familyboardbooks.com"},"FST":{"name":"Family Storybooks","site":"https://www.familystorybooks.co.uk","email":"hello@familystorybooks.co.uk"},"FLR":{"name":"Family Learn to Read","site":"https://www.familylearntoread.com","email":"hello@familyboardbooks.com"},"FPC":{"name":"Family Photo Calendars","site":"https://www.familyphotocalendars.com","email":"hello@familyboardbooks.com"},"FJP":{"name":"Family Jigsaw Puzzles","site":"https://www.familyjigsawpuzzles.com","email":"hello@familyboardbooks.com"},"default":{"name":"Our Family Presents","site":"https://www.ourfamilypresents.com","email":"hello@familyboardbooks.com"}}'

# Secrets (set with `npx wrangler secret put NAME`, never written in this file):
#   GEMINI_API_KEY, OPENAI_API_KEY, SHOPIFY_WEBHOOK_SECRET, ADMIN_TOKEN, TURNSTILE_SECRET (optional),
#   SHOPIFY_ADMIN_TOKEN (or SHOPIFY_CLIENT_ID + SHOPIFY_CLIENT_SECRET): marks orders "being made" and adds tracking,
#   MAIL_API_KEY (Zoho ZeptoMail, EU): file reminder emails and problem reports,
#   LULU_CLIENT_KEY, LULU_CLIENT_SECRET (one Lulu account for every brand; live keys since 20 Nov 2026; sandbox keys only with LULU_ENV = "sandbox")
